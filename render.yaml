# Render Blueprint — API servisi.
# Veritabani Neon'da tutuldugu icin burada DATABASE_URL elle girilir.
services:
  - type: web
    name: kardiyo-api
    runtime: node
    rootDir: api
    plan: free
    buildCommand: npm install
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: 'true'
      - key: DATABASE_URL
        sync: false # Neon baglanti adresi (Render panelinden girilir)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # ornek: https://10adimdakardiyoloji.com,https://www.10adimdakardiyoloji.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
